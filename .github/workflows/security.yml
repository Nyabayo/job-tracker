name: Security scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *" # daily: new CVEs appear without code changes

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (Gitleaks CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history
          persist-credentials: false
      - name: Install Gitleaks (checksum verified)
        run: |
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan
        run: ./gitleaks git --redact --report-format sarif --report-path gitleaks.sarif --exit-code 1 .
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  semgrep:
    name: SAST (Semgrep Community Edition)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The project's own rules (.semgrep/job-tracker.yaml): CSRF and auth
      # checks in server actions, raw SQL, client IPs, cookies. Their tests run
      # first so a broken rule can't pass silently.
      - name: Test the project rules
        run: semgrep --test --config .semgrep/job-tracker.yaml .semgrep/job-tracker.tsx
      # ERROR-severity findings (High/Critical) fail the build; all go to SARIF.
      - run: semgrep scan --config p/default --config p/owasp-top-ten --config p/typescript --config p/nextjs --config .semgrep/job-tracker.yaml --exclude .semgrep --metrics off --sarif --output semgrep.sarif
      - run: semgrep scan --config p/default --config p/owasp-top-ten --config p/typescript --config p/nextjs --config .semgrep/job-tracker.yaml --exclude .semgrep --metrics off --severity ERROR --error
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  npm-audit:
    name: Dependencies (npm audit, registry signatures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # --ignore-scripts: nothing from a dependency runs while we check it.
      - run: npm ci --ignore-scripts
      # Everything that ships in the app image; dev tooling is covered by OSV-Scanner.
      - run: npm audit --omit=dev --audit-level=high
      # Every package must carry a valid npm registry signature (tampering check).
      - run: npm audit signatures

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    env:
      ZIZMOR_VERSION: "1.31.0"
      ZIZMOR_SHA256: "bb4203c790f8d33e110dbeee2ac6d70911e233b93574ffc770aaa21ecd850302"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor (hash verified)
        run: |
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > zizmor-req.txt
          python3 -m pip install --user --require-hashes --only-binary :all: -r zizmor-req.txt
      # Template injection, excessive permissions, unpinned actions or images,
      # credential persistence and other GitHub Actions risks. The read-only
      # token lets it also check for impostor commits and known-bad actions.
      - run: zizmor --format sarif .github/workflows > zizmor.sarif
        env:
          GH_TOKEN: ${{ github.token }}
      - run: zizmor --min-severity medium .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  osv-scanner:
    name: Dependencies (OSV-Scanner)
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=package-lock.json
        --config=osv-scanner.toml

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Rule 9: only open-source licences that let anyone self-host.
          deny-licenses: SSPL-1.0, BUSL-1.1, Elastic-2.0, Commons-Clause

  hadolint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          failure-threshold: warning
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  trivy:
    name: Container and filesystem (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the runtime image
        run: docker build --target runner -t job-tracker:scan .
      - name: Scan the image (fail on fixable High/Critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: job-tracker:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
      - name: Scan the repository (deps, IaC, secrets)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
