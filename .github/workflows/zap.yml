name: OWASP ZAP baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "11 5 * * 1" # weekly

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the app with Docker Compose
        run: ./scripts/selfhost.sh
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 5
          done
          docker compose logs
          exit 1
      # Passive scan. Rules marked FAIL in .zap/rules.tsv (missing CSP,
      # clickjacking, cookie flags, secrets in URLs...) fail the build.
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          cmd_options: "-j -I"
          allow_issue_writing: false
          artifact_name: zap-report
