# Project-specific Semgrep rules: the security rules this codebase relies on,
# checked on every pull request (.github/workflows/security.yml) and locally
# with `npm run security`. Tests for each rule live in job-tracker.tsx next to
# this file; run them with `semgrep --test .semgrep`.
rules:
  - id: server-action-missing-csrf-check
    message: >-
      Every exported server action is a public POST endpoint. Check the CSRF
      token first: `if (!(await csrfValid(input))) return CSRF_FAILED;`
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      cwe: "CWE-352: Cross-Site Request Forgery (CSRF)"
      owasp: "A01:2021 - Broken Access Control"
    paths:
      include: ["**/actions.ts", ".semgrep/job-tracker.tsx"]
    patterns:
      - pattern: |
          export async function $ACTION(...) { ... }
      - pattern-not: |
          export async function $ACTION(...) { ... if (<... csrfValid(...) ...>) $STMT; ... }

  - id: app-action-missing-require-user
    message: >-
      Server actions for signed-in pages must call requireUser() so an
      anonymous request can't reach them.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      cwe: "CWE-862: Missing Authorization"
      owasp: "A01:2021 - Broken Access Control"
    paths:
      include: ["app/(app)/**/actions.ts", ".semgrep/job-tracker.tsx"]
    patterns:
      - pattern: |
          export async function $ACTION(...) { ... }
      - pattern-not: |
          export async function $ACTION(...) { ... requireUser(); ... }
      - pattern-not: |
          export async function $ACTION(...) { ... $X = await requireUser(); ... }
      - pattern-not: |
          export async function $ACTION(...) { ... const $X = await requireUser(); ... }

  - id: prisma-raw-unsafe
    message: >-
      $queryRawUnsafe / $executeRawUnsafe build SQL from strings. Use the
      tagged-template $queryRaw / $executeRaw, which sends values as parameters.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"
    pattern-either:
      - pattern: $DB.$queryRawUnsafe(...)
      - pattern: $DB.$executeRawUnsafe(...)

  - id: dangerously-set-inner-html
    message: >-
      dangerouslySetInnerHTML bypasses React's escaping. Render text as
      children instead; if HTML is truly needed, sanitise it on the server.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "A03:2021 - Injection"
    pattern: <$EL dangerouslySetInnerHTML={$V} ... />

  - id: math-random-for-security
    message: >-
      Math.random() is predictable. Use generateToken() from @/lib/auth/tokens
      or crypto.getRandomValues for anything an attacker must not guess.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak PRNG"
      owasp: "A02:2021 - Cryptographic Failures"
    paths:
      exclude: ["tests/**", "components/**"]
    pattern: Math.random()

  - id: cookie-without-httponly
    message: >-
      Set httpOnly: true (and secure, sameSite) on every cookie the server
      sends, so page scripts can't read it.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      cwe: "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp: "A05:2021 - Security Misconfiguration"
    patterns:
      - pattern-either:
          - pattern: $RES.cookies.set($NAME, $VALUE, $OPTS)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      const $JAR = await cookies();
                      ...
                  - pattern-inside: |
                      $JAR = await cookies();
                      ...
              - pattern: $JAR.set($NAME, $VALUE, $OPTS)
      - pattern-not: |
          $X.set($NAME, $VALUE, {..., httpOnly: true, ...})

  - id: forwarded-for-read-directly
    message: >-
      Read the client IP only through forwardedClientIp() in lib/ip.ts. The
      first X-Forwarded-For entry is sent by the client and can be forged.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      cwe: "CWE-348: Use of Less Trusted Source"
      owasp: "A07:2021 - Identification and Authentication Failures"
    patterns:
      - pattern-either:
          - pattern: $H.get("x-forwarded-for")
          - pattern: $H.get("x-real-ip")
      - pattern-not-inside: forwardedClientIp(...)

  - id: rate-limit-fails-open
    message: >-
      A rate limit that lets requests through when its key is missing
      silently switches off. Fall back to a shared bucket instead.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      cwe: "CWE-636: Not Failing Securely"
      owasp: "A04:2021 - Insecure Design"
    patterns:
      - pattern-inside: |
          async function $F(..., $KEY: string | null, ...) { ... }
      - pattern: |
          if (!$KEY) return true;

  - id: server-fetch-outside-ssrf-guard
    message: >-
      Server code must fetch user-supplied URLs only through safeFetch() in
      lib/fetcher, which blocks private, loopback and metadata addresses,
      re-checks every redirect and caps time and size.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery"
    paths:
      include: ["app/**", "lib/**", ".semgrep/job-tracker.tsx"]
      exclude: ["lib/fetcher/**", "components/**"]
    pattern-either:
      - pattern: fetch(...)
      - pattern: http.request(...)
      - pattern: https.request(...)
      - pattern: http.get(...)
      - pattern: https.get(...)
